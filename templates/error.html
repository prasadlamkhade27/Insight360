{% extends "base.html" %}

{% block title %}Error - Insights360{% endblock %}

{% block content %}
<section class="hero-section" style="padding: 40px 20px;">
  <h1 class="hero-title" style="color: #ff4444;">❌ Oops! Something went wrong</h1>
</section>

<section class="container" style="padding: 40px 20px;">
  <div class="card" style="text-align: center;">
    <div style="font-size: 4rem; margin-bottom: 20px;">⚠️</div>
    <h2 style="color: var(--primary-light); margin-bottom: 20px;">Error</h2>
    <p style="color: var(--text-secondary); font-size: 1.1rem; margin-bottom: 30px;">{{ message }}</p>
    <a href="/" class="btn btn-primary">↩️ Back to Home</a>
  </div>
</section>

{% endblock %}
